# Local database for development: PostgreSQL + Adminer (database viewer on http://localhost:8080)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: madd
      POSTGRES_PASSWORD: madd_dev_only
      POSTGRES_DB: madd
    ports: ["5433:5432"]
    volumes:
      - madd_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  adminer:
    image: adminer
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: db
volumes:
  madd_pgdata:
